# Local / small-scale deployment. Only the web port is published; the
# container reaches Mailcow over the network using the hosts in .env.
services:
  webmail:
    build: .
    image: mailcow-webmail:local
    container_name: webmail
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_PATH: /data/webmail.db
      UPLOAD_DIR: /data/uploads
    ports:
      - '127.0.0.1:3004:3000'
    volumes:
      - webmail-data:/data
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  webmail-data: